experiment_name: frozen_order_head
seed: 42
output_dir: outputs

model:
  type: frozen_order_head
  name_or_path: Qwen/Qwen2-VL-7B-Instruct
  freeze_backbone: true
  from_pretrained_kwargs: {}

data:
  path:
  id_column: sample_id
  order_column: gold_order
  image_columns:
    - image_1
    - image_2
    - image_3
    - image_4
  valid_ratio: 0.1
  split_path: outputs/splits/frozen_order_head_seed42.json

training:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  save_steps: 100

evaluation:
  batch_size: 1
