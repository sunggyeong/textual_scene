[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textual-scene"
version = "0.1.0"
description = "Reusable training and evaluation utilities for textual scene order experiments."
requires-python = ">=3.10"
dependencies = [
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
